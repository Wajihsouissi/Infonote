<!doctype html>

<x-dc>

<div style="position: relative; width: 1440px; height: 1340px; background: #161616; color: #ffffff; overflow: hidden;">

        <div style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 12px; color: #e6e6e6; color: #a3a3a3;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9h-9a7 7 0 0 0 0 14h3"/></svg></div>

    <!-- Project Goal -->
    <div style="position: absolute; left: 132px; top: 244px; width: 700px; height: 700px; display: flex; flex-direction: column; border-radius: 32px; background: #1d1d1d; border: 1px solid rgba(255,255,255,0.10);">
      <div style="padding: 22px 26px 14px; font-size: 21px; font-weight: 600; letter-spacing: -0.01em;">Project Goal</div>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; flex: 1; margin: 0 8px 8px; border-radius: 24px; background: #181818;">
        <div style="font-size: 17px; font-weight: 600;">Click to start writing</div>
        <div style="font-size: 14px; color: #a3a3a3;">Your first block will appear here.</div>
      </div>
    </div>

    <!-- Features, tinted jade -->
    <div style="position: absolute; left: 928px; top: 244px; width: 340px; height: 330px; display: flex; flex-direction: column; border-radius: 32px; background: color-mix(in srgb, #45df95 14%, #1d1d1d); border: 1px solid color-mix(in srgb, #45df95 34%, transparent);">

        Core features include atomic notes, infinite canvas, and smart linking between notes
      </div>

      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 9px;">
        <div style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 999px; ">

        <div style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 999px; ">
              <span style="display: block; width: 22px; height: 22px; border-radius: 999px; background: #46dbdb;"></span>

        <div style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 999px; ">

    <!-- cards counter -->

      </div>
    </div>

    <!-- minimap -->
    <div style="position: absolute; right: 24px; bottom: 24px; display: flex; align-items: stretch; gap: 8px;">
      <div style="position: relative; width: 250px; height: 156px; border-radius: 12px; background: color-mix(in srgb, #000000 55%, #0d0d0d); border: 1px solid rgba(255,255,255,0.10); overflow: hidden;">

        <div style="display: flex; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></div>
        <div style="display: flex; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></div>
        <div style="display: flex; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7"/></svg></div>
      </div>

  <!-- palette caption, off-canvas chrome so it never sits on the mockup -->
  <div style="position: absolute; left: 32px; top: 14px; display: none;">Graphite Deepest</div>
